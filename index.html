<style>
:root{--navy:#0f1f3d;--navy2:#16294f;--gold:#d4a017;--gold2:#b8860b;--goldt:#e8c869;--ok:#16a34a;--okS:#e7f7ee;--bad:#dc2626;--badS:#fdecec;--warn:#c26a05;--warnS:#fff4e2;--pri:#2f6bed;--priS:#eaf1ff;--ink:#172235;--mut:#66748b;--line:#e4e9f1;--bg:#f2f5fa;--card:#fff;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}

html,body{height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:#dfe5ef;color:var(--ink);font-size:15px;overscroll-behavior-y:none}

input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}

.cab{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(var(--safe-t) + 12px) 18px 18px;flex:none}

.cab .ola{margin-top:14px;font-size:13.5px;opacity:.85}.cab h1{font-size:21px;margin-top:2px;font-weight:800}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);margin-left:auto;font-size:17px}

.trio small{font-size:11px;color:var(--mut);font-weight:800}.trio b{display:block;font-size:14.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.gauge{display:flex;align-items:center;gap:14px;margin-top:6px}.gauge svg{flex:none}
.gauge .v{font-size:20px;font-weight:800}.gauge small{color:var(--mut);font-size:12px;display:block}
.anel{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none}

.dica{font-size:12.5px;margin-top:4px;line-height:1.4}
.das{display:flex;align-items:center;gap:12px;margin-top:8px}
.data{width:50px;height:52px;border-radius:12px;background:var(--warnS);color:var(--warn);display:grid;place-items:center;text-align:center;font-weight:800;line-height:1;flex:none;font-size:19px}
.data small{font-size:9.5px;display:block}.data.bad{background:var(--badS);color:var(--bad)}.data.ok{background:var(--okS);color:var(--ok)}
.btnp{background:var(--navy);color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;font-size:13.5px}
.btng{background:linear-gradient(145deg,var(--gold),var(--gold2));color:var(--navy);border-radius:14px;padding:15px;font-weight:800;font-size:15.5px;width:100%}
.btns{background:#e8edf5;border-radius:12px;padding:11px 14px;font-weight:800;font-size:13.5px}
.btnx{color:var(--bad);font-weight:800;padding:12px;width:100%;margin-top:6px}
.lanc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);width:100%;text-align:left}

.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.lanc .t{flex:1;min-width:0}.lanc .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lanc .t small{color:var(--mut);font-size:11.5px}

.lbl{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 6px}

.sw{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;width:100%;margin-top:10px;text-align:left;gap:10px}
.sw i{width:44px;height:26px;border-radius:20px;background:#cfd6e2;position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{background:var(--ok)}.sw.on i::after{left:21px}
.sobre{position:absolute;inset:0;background:rgba(10,18,32,.72);display:flex;align-items:flex-end;z-index:20}
.folha{background:#fff;border-radius:26px 26px 0 0;width:100%;padding:22px 18px calc(24px + var(--safe-b));animation:sobe .25s ease;max-height:92%;overflow-y:auto}
@keyframes sobe{from{transform:translateY(40px);opacity:0}}
.onda{display:flex;gap:4px;justify-content:center;align-items:center;height:50px;margin:10px 0}
.onda i{width:5px;background:var(--gold);border-radius:4px;animation:onda 1s infinite ease-in-out}
@keyframes onda{0%,100%{height:10px}50%{height:42px}}
.fala{text-align:center;font-size:16px;font-weight:700;min-height:24px}
.entendi{background:var(--okS);border-radius:14px;padding:12px;margin-top:12px;font-size:13.5px}
.entendi div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.barras{display:flex;align-items:flex-end;gap:8px;height:120px;margin:12px 2px 2px}
.barras>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:10.5px;color:var(--mut);font-weight:800}
.barras .par{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%}
.barras i{flex:1;border-radius:6px 6px 2px 2px;display:block;min-height:2px}
.rel{font-size:12.5px}.rel>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.rel>div.t{font-weight:800;border:0;background:#f3f6fb;border-radius:8px;padding:8px;margin-top:4px}
.rel>div.g{font-weight:800;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border:0;padding-top:10px}
.share{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.share button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:800;text-align:center;line-height:1.2}
.share span{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:25px;color:#fff}
.share button:disabled{opacity:.35}
.toast{position:absolute;left:14px;right:14px;bottom:calc(86px + var(--safe-b));background:var(--navy);color:#fff;padding:13px 14px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:30;animation:sobe .2s;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.tg{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:30px;font-size:11px;font-weight:800;background:#eef2f8;color:#334155;white-space:nowrap}
.tg.ok{background:var(--okS);color:var(--ok)}.tg.bad{background:var(--badS);color:var(--bad)}.tg.warn{background:var(--warnS);color:var(--warn)}.tg.pri{background:var(--priS);color:var(--pri)}
.aviso{border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.aviso.warn{background:var(--warnS);color:#7a4300}.aviso.pri{background:var(--priS);color:#1d3f8f}.aviso.ok{background:var(--okS);color:#0f5c2c}
.aviso button{margin-top:8px}
.meses{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:6px;margin-bottom:12px}
.meses button{width:40px;height:36px;border-radius:10px;font-size:20px;font-weight:800;color:var(--navy)}
.meses button:disabled{opacity:.25}
.meses b{font-size:15px}
.vazio{text-align:center;color:var(--mut);padding:26px 10px;font-size:13.5px;line-height:1.5}
.vazio span{font-size:36px;display:block;margin-bottom:6px}
.barra{height:7px;background:#eef2f8;border-radius:10px;overflow:hidden}.barra i{display:block;height:100%;border-radius:10px}
.lin2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.boas{flex:1;background:linear-gradient(160deg,#0f1f3d,#16294f 60%,#24396a);color:#fff;padding:calc(var(--safe-t) + 40px) 24px calc(24px + var(--safe-b));display:flex;flex-direction:column;overflow-y:auto}
.boas .lg{width:58px;height:58px;border-radius:17px}
.boas h1{font-size:26px;margin-top:10px;line-height:1.2}
.boas p{opacity:.85;margin-top:12px;line-height:1.55}
.boas .box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:14px;margin-top:20px;font-size:13.5px;line-height:1.75}
.boas .campo{background:rgba(255,255,255,.95);border:0;color:var(--ink)}
.boas label{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;margin:14px 0 6px;color:var(--goldt)}
.eyebrow{color:var(--goldt);font-size:12px;font-weight:800;letter-spacing:.1em;margin-top:22px}
#print{display:none}
@media print{body{background:#fff}#app{display:none!important}#print{display:block;font:12px/1.4 Arial,sans-serif;color:#000;padding:10mm}
 #print table{width:100%;border-collapse:collapse;margin-top:8px}#print td{border:1px solid #999;padding:6px}#print .n{text-align:right}#print .g td{background:#eee;font-weight:bold}#print h2{text-align:center;font-size:15px}}
</style>

<script>
/* ===== Núcleo VIMALI Caixa — o mesmo código no app do celular e no Módulo MEI ===== */
const VC=(()=>{
  /* categorias: as mesmas chaves do livro caixa do Módulo MEI */
  const ENT=[['serv','✂️','Serviços','Prestação de serviços'],['com','🛍️','Vendas','Revenda de mercadorias (comércio)'],['ind','🏭','Produção própria','Venda de produtos industrializados (indústria)'],
    ['tmun','🚚','Frete municipal','Frete / transporte municipal de cargas'],['tinter','🛣️','Frete fora da cidade','Frete intermunicipal ou interestadual de cargas'],['tpass','🚐','Transporte de passageiros','Transporte de passageiros'],
    ['outras','➕','Outras entradas','Outras entradas (não são receita bruta)']];
  const SAI=[['mp','🧴','Produtos e insumos','Matéria-prima e insumos'],['merc','🛒','Mercadoria p/ revender','Compra de mercadorias para revenda'],['aluguel','🏠','Aluguel','Aluguel e condomínio'],['energia','💡','Luz, água, gás','Energia, água e gás'],
    ['tel','📶','Internet e celular','Telefone e internet'],['comb','⛽','Combustível','Combustível e pedágio'],['manut','🔧','Manutenção','Manutenção de veículo/equipamentos'],['das','🧾','DAS do MEI','DAS-MEI'],
    ['banco','💳','Maquininha e banco','Tarifas bancárias e maquininha'],['mat','📎','Material de consumo','Material de consumo/escritório'],['mkt','📣','Divulgação','Marketing e publicidade'],['frete','📦','Fretes e entregas','Fretes pagos'],
    ['sal','👷','Salário do funcionário','Salário de empregado'],['enc','🏛️','FGTS e INSS do funcionário','Encargos (FGTS, CPP, INSS)'],['hon','🧮','Contador','Honorários contábeis'],['taxas','📜','Taxas e alvarás','Taxas, licenças e alvarás'],
    ['invest','🧰','Equipamento ou veículo','Investimentos (equipamentos, veículo)'],['retirada','👛','Retirada para mim','Retirada do titular (não é despesa)'],['outras','➕','Outras despesas','Outras despesas operacionais']];
  const cats=t=>t==='R'?ENT:SAI;
  const cat=(t,k)=>cats(t).find(c=>c[0]===k)||['outras','•',k,k];
  /* entradas que o perfil do cliente usa (caminhoneiro, serviços, comércio) */
  function entradasDo(perfil){const t=perfil.t,tr=perfil.tr||'ISS';
    if(t==='TAC')return ['tinter','tmun','tpass','outras'];
    const l=[];if(/ISS/.test(tr))l.push('serv');if(/ICMS/.test(tr))l.push('com','ind');if(!l.length)l.push('serv');
    if(!l.includes('com'))l.push('com');l.push('outras');return l;}
  function entradaPadrao(perfil){return entradasDo(perfil)[0];}
  function saidasDo(perfil){const base=perfil.t==='TAC'?['comb','manut','taxas','das','tel','banco','retirada','outras']:['mp','merc','aluguel','energia','tel','das','banco','retirada'];
    return base.concat(SAI.map(c=>c[0]).filter(k=>!base.includes(k)));}

  /* ---------- dias úteis e DAS (feriados nacionais bancários) ---------- */
  function pascoa(Y){const a=Y%19,b=Math.floor(Y/100),c=Y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return new Date(Y,Math.floor(n/31)-1,n%31+1);}
  const _f={};
  function feriados(Y){if(_f[Y])return _f[Y];const p=pascoa(Y),rel=d=>{const x=new Date(p);x.setDate(x.getDate()+d);return x;};
    const l=[[0,1,'Confraternização Universal'],[3,21,'Tiradentes'],[4,1,'Dia do Trabalho'],[8,7,'Independência'],[9,12,'Nossa Senhora Aparecida'],[10,2,'Finados'],[10,15,'Proclamação da República'],[11,25,'Natal']].map(([m,d,n])=>[new Date(Y,m,d),n]);
    if(Y>=2024)l.push([new Date(Y,10,20),'Consciência Negra']);
    l.push([rel(-48),'Carnaval'],[rel(-47),'Carnaval'],[rel(-2),'Sexta-feira Santa'],[rel(60),'Corpus Christi']);
    const o={};l.forEach(([d,n])=>{o[d.getMonth()*100+d.getDate()]=n;});return _f[Y]=o;}
  const feriado=d=>feriados(d.getFullYear())[d.getMonth()*100+d.getDate()]||'';
  const util=d=>d.getDay()%6!==0&&!feriado(d);
  function vencDAS(Y,m){const d=new Date(Y,m+1,20);const orig=new Date(d);while(!util(d))d.setDate(d.getDate()+1);
    return {d,prorrogado:d.getTime()!==orig.getTime(),motivo:feriado(orig)||(orig.getDay()===0?'domingo':orig.getDay()===6?'sábado':'')};}
  const ym=(Y,m)=>{const d=new Date(Y,m,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
  const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);

  /* ---------- código de envio: JSON → deflate → base64url, com conferência ---------- */
  const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/[/]/g,'_').replace(/=+$/,'');};
  const b64d=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;};
  const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);};
  async function fluxo(u8,T){const s=new Blob([u8]).stream().pipeThrough(new T('deflate-raw'));return new Uint8Array(await new Response(s).arrayBuffer());}
  async function codificar(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));let corpo='0.'+b64e(raw);
    try{if(typeof CompressionStream!=='undefined'){const z=await fluxo(raw,CompressionStream);if(z.length<raw.length)corpo='1.'+b64e(z);}}catch(e){}
    const b=corpo.slice(2);return `VMC${corpo[0]}.${b}.${hash(b)}~`;}
  async function decodificar(texto){
    const m=String(texto||'').match(/VMC([01])\.([A-Za-z0-9_\-\s>]+?)\.([0-9a-z]+)~/);

function dasPago(comp){const p=P();if(D.das[comp])return true;const Y=+comp.slice(0,4),m=+comp.slice(5,7)-1;const b=(p.dp||{})[Y];return !!(b&&(b>>m)&1);}
function dasLista(){ // competências do ano corrente (e dezembro anterior) já exigíveis
  const p=P(),Y=H.getFullYear(),hoje=new Date(H.toDateString());const out=[];
  let ini=new Date((p.dp||{})[Y-1]!=null?Y-1:Y,(p.dp||{})[Y-1]!=null?11:0,1);if(p.ab){const a=new Date(p.ab+'T12:00:00');if(a>ini)ini=new Date(a.getFullYear(),a.getMonth(),1);}
  if(!p.dp){const i=new Date(D.inicio+'T12:00:00');const ii=new Date(i.getFullYear(),i.getMonth()-1,1);if(ii>ini)ini=ii;}
  for(let d=new Date(ini);d<=new Date(Y,H.getMonth(),1);d.setMonth(d.getMonth()+1)){const comp=VC.ym(d.getFullYear(),d.getMonth()),v=VC.vencDAS(d.getFullYear(),d.getMonth());
    out.push({comp,Y:d.getFullYear(),m:d.getMonth(),venc:v.d,motivo:v.prorrogado?v.motivo:'',pago:dasPago(comp),vencido:v.d<hoje});}
  return out;}
function proxDAS(){const l=dasLista();const atr=l.filter(x=>!x.pago&&x.vencido);if(atr.length)return {...atr[0],atrasados:atr.length};
  return l.find(x=>!x.pago)||null;}
function valorDAS(Y){const d=P().d||{},ks=Object.keys(d).map(Number).sort();if(d[Y])return d[Y];const k=ks.filter(x=>x<=Y).pop()??ks[0];return k!=null?d[k]:0;}
function saudeAtual(){const li=limiteInfo()||{};return VC.saude(D.lanc,{hoje:H,inicio:D.inicio,limite:li.limite,mesInicio:li.mesInicio,nMeses:li.nMeses,fat:li.fat,dasPend:dasLista().filter(x=>!x.pago&&x.vencido).length});}
function gauge(p){p=Math.max(0,Math.min(1.2,p));const a=Math.PI*Math.min(p,1),R=46,x=60-R*Math.cos(a),y=58-R*Math.sin(a);const cor=p>1?'#dc2626':p>.8?'#d97706':'#16a34a';
  return `<svg width="120" height="66" viewBox="0 0 120 66" aria-hidden="true"><path d="M14 58a46 46 0 0 1 92 0" fill="none" stroke="#e6ebf2" stroke-width="11" stroke-linecap="round"/>${p>0.005?`<path d="M14 58A46 46 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${cor}" stroke-width="11" stroke-linecap="round"/>`:''}<text x="60" y="55" text-anchor="middle" font-size="17" font-weight="800" fill="#172235">${Math.round(p*100)}%</text></svg>`;}

function lancHTML(x){return `<button class="lanc" onclick="editar('${x.id}')"><div class="ico" style="background:${x.tipo==='R'?'var(--okS)':'var(--badS)'}">${icoCat(x.tipo,x.cat)}</div><div class="t"><b>${esc(x.desc||VC.cat(x.tipo,x.cat)[2])}</b><small>${fmtD(x.data)} · ${esc(x.forma)}${x.tipo==='R'?(x.nf?' · com nota':' · sem nota'):''}</small></div><span class="vl ${x.tipo==='R'?'ok':'bad'}">${x.tipo==='R'?'+':'−'} ${brl(x.valor)}</span></button>`;}

function trocaTipo(t){const p=P();st.f.tipo=t;st.f.cat=t==='R'?VC.entradaPadrao(p):VC.saidasDo(p)[0];st.f.nf=false;st.mais=false;r();}

  const env=D.envios.filter(e=>e.p===VC.ym(Y,m)).slice(-1)[0];
  const venc=new Date(Y,m+1,20);

/* iPhone/iPad: o Safari tem webkitSpeechRecognition, mas ele não funciona no app da tela inicial; lá o caminho é o microfone do teclado. */
const SR_RAW=window.SpeechRecognition||window.webkitSpeechRecognition;
const SR=(SR_RAW&&!/iphone|ipad|ipod/i.test(navigator.userAgent)&&!(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))?SR_RAW:null;let rec=null;
function abrirVoz(){st.voz={fase:SR?'ouvindo':'escrever',txt:'',res:null};r();
  if(!SR){const i=document.getElementById('vTxt');if(i)i.focus();return;} /* foco no mesmo toque: abre o teclado com o microfone */
  const v=st.voz,md=navigator.mediaDevices;
  /* Android (app da tela inicial): o reconhecimento de voz nem sempre pede a permissão sozinho; pedimos o microfone de forma explícita antes de ouvir */
  if(md&&md.getUserMedia){md.getUserMedia({audio:true}).then(s=>{s.getTracks().forEach(t=>t.stop());if(st.voz===v)ouvir();})
    .catch(e=>{if(st.voz!==v)return;const sem=e&&(e.name==='NotFoundError'||e.name==='DevicesNotFoundError');st.voz={fase:'escrever',txt:'',erro:ERRO_VOZ[sem?'audio-capture':'not-allowed'],cod:sem?'audio-capture':'not-allowed (permissão)'};r();});}
  else ouvir();}
const ERRO_VOZ={'not-allowed':'O microfone está bloqueado para este app. Libere em Configurações do celular › Apps › (Chrome ou VIMALI Caixa) › Permissões › Microfone. Enquanto isso, escreva abaixo ou use o microfone do teclado.',
  'service-not-allowed':'O celular não liberou o reconhecimento de voz para este app. Use o microfone do teclado (no campo abaixo) ou escreva.',
  'network':'O reconhecimento de voz precisa de internet e não conseguiu conectar. Verifique a conexão ou escreva abaixo.',
  'audio-capture':'Não encontrei o microfone do aparelho. Escreva abaixo ou use o microfone do teclado.',
  'no-speech':'Não ouvi nada. Fale perto do microfone ou escreva abaixo.',
  'language-not-supported':'O reconhecimento de voz em português não está disponível neste aparelho. Use o microfone do teclado.',
  'timeout':'O reconhecimento de voz não respondeu. Use o microfone do teclado (no campo abaixo) ou escreva.',
  'sem-audio':'Não ouvi nada. Fale perto do microfone ou escreva abaixo.'};
function ouvir(){const v=st.voz;let ini=false,fim=false;
  const falhar=cod=>{if(fim||!st.voz||st.voz!==v)return;fim=true;pararVoz();st.voz={fase:'escrever',txt:v.txt||'',erro:ERRO_VOZ[cod]||'Não consegui ouvir agora. Escreva abaixo ou use o microfone do teclado.',cod};r();};
  try{rec=new SR();rec.lang='pt-BR';rec.interimResults=true;rec.maxAlternatives=1;
    rec.onstart=()=>{ini=true;};
    rec.onresult=e=>{if(st.voz!==v||fim)return;let t='';for(const x of e.results)t+=x[0].transcript;v.txt=t;ini=true;if(e.results[e.results.length-1].isFinal){fim=true;entender(t);}else{const f=document.querySelector('.fala');if(f)f.textContent='"'+t+'"';}};
    rec.onerror=e=>{if(e.error==='aborted')return;falhar(e.error);};
    rec.onend=()=>{if(st.voz!==v||fim)return;if(v.txt){fim=true;entender(v.txt);}else falhar('sem-audio');};
    setTimeout(()=>{if(!ini)falhar('timeout');},6000); /* se nada começar em 6 s (ex.: tela de permissão ignorada), cai no teclado */
    rec.start();}catch(e){falhar('timeout');}}
function pararVoz(){try{rec&&rec.abort();}catch(e){}rec=null;}
function entender(t){const res=VC.interpretar(t,P());st.voz={fase:'entendi',txt:t,res};r();}
function vozHTML(){const v=st.voz;
  if(v.texto)return `<div class="sobre" onclick="if(event.target===this){st.voz=null;r()}"><div class="folha"><b>Copie o texto abaixo</b><p class="dica mut">Toque e segure no texto, escolha "Selecionar tudo" e depois "Copiar".</p><textarea class="campo" style="height:220px;margin-top:10px;font-size:12px" readonly>${esc(v.texto)}</textarea><button class="btng" style="margin-top:12px" onclick="st.voz=null;ir('confirma')">Já copiei e enviei</button></div></div>`;
  const ex=['vendi 150 reais no pix','paguei 80 de luz','gastei 45 de gasolina no cartão','recebi 200 de serviço em dinheiro'];
  return `<div class="sobre" onclick="if(event.target===this){st.voz=null;pararVoz();r()}"><div class="folha" role="dialog" aria-label="Lançar falando">
  <div style="text-align:center;font-weight:800;color:var(--mut);font-size:12px;letter-spacing:.08em">${v.fase==='ouvindo'?'OUVINDO… FALE O LANÇAMENTO':v.fase==='entendi'?'ENTENDI ASSIM':'ESCREVA COMO VOCÊ FALARIA'}</div>
  ${v.fase==='ouvindo'?`<div class="onda">${Array.from({length:14},(_,i)=>`<i style="animation-delay:${i*.07}s"></i>`).join('')}</div><div class="fala">${v.txt?'"'+esc(v.txt)+'"':'<span class="mut" style="font-weight:600;font-size:14px">Ex.: "vendi 150 reais de bolo no pix"</span>'}</div>
   <button class="btns" style="width:100%;margin-top:14px" onclick="pararVoz();st.voz.fase='escrever';r()">Prefiro escrever</button>`:''}
  ${v.fase==='escrever'?`${v.erro?`<div class="aviso warn" style="margin-top:10px"><span>🎙️</span><div>${esc(v.erro)}${v.cod?`<br><span style="font-size:11px;opacity:.7">código: ${esc(v.cod)}</span>`:''}</div></div>`:''}<input id="vTxt" class="campo" style="margin-top:12px" placeholder="vendi 150 reais no pix" value="${esc(v.txt)}" onkeydown="if(event.key==='Enter')entender(this.value)" enterkeyhint="done">
   <div class="chips" style="margin-top:10px">${ex.map(x=>`<button onclick="entender('${x}')">${x}</button>`).join('')}</div>
   <button class="btng" style="margin-top:14px" onclick="entender(document.getElementById('vTxt').value)">Entender</button>
   ${SR?`<button class="btns" style="width:100%;margin-top:8px" onclick="st.voz={fase:'ouvindo',txt:''};r();ouvir()">🎙️ Tentar falando</button>`:'<div class="aviso pri" style="margin:12px 0 0"><span>🎙️</span><div><b>Para falar:</b> toque no campo acima e, no teclado do celular, toque no <b>microfone</b> (🎙️) e dite. Depois toque em <b>Entender</b>.</div></div>'}`:''}
  ${v.fase==='entendi'?`<div class="fala" style="margin-top:8px">"${esc(v.txt)}"</div>${v.res.ok?`<div class="entendi">
   <div><span>Tipo</span><b class="${v.res.tipo==='R'?'ok':'bad'}">${v.res.tipo==='R'?'Entrou':'Saiu'}</b></div><div><span>Valor</span><b>${brl(v.res.valor)}</b></div>
   <div><span>Categoria</span><b>${icoCat(v.res.tipo,v.res.cat)} ${esc(VC.cat(v.res.tipo,v.res.cat)[2])}</b></div><div><span>Descrição</span><b>${esc(v.res.desc)}</b></div>
   <div><span>Forma</span><b>${esc(v.res.forma||'Pix')}${v.res.forma?'':' <span class="mut" style="font-weight:600">(padrão)</span>'}</b></div>${v.res.nf!=null?`<div><span>Nota fiscal</span><b>${v.res.nf?'Sim':'Não'}</b></div>`:''}</div>
   <div style="display:flex;gap:8px;margin-top:12px"><button class="btns" style="flex:1" onclick="corrigirVoz()">Corrigir</button><button class="btng" style="flex:2" onclick="confirmarVoz()">Confirmar</button></div>`
   :`<div class="aviso warn" style="margin-top:12px"><span>🤔</span><div>Não entendi ${!v.res.valor?'o valor':'se entrou ou saiu'}. Tente algo como <b>"vendi 150 reais no pix"</b> ou <b>"paguei 80 de luz"</b>.</div></div>
   <div style="display:flex;gap:8px;margin-top:8px"><button class="btns" style="flex:1" onclick="st.voz={fase:'escrever',txt:st.voz.txt};r()">Escrever</button>${SR?`<button class="btng" style="flex:1" onclick="st.voz={fase:'ouvindo',txt:''};r();ouvir()">Falar de novo</button>`:''}</div>`}`:''}
  </div></div>`;}
function confirmarVoz(){const x=st.voz.res;D.lanc.push({id:uid(),data:hojeISO(),tipo:x.tipo,cat:x.cat,valor:x.valor,desc:x.desc,forma:x.forma||'Pix',nf:!!x.nf,u:Date.now()});gravar();st.voz=null;aviso(`${x.tipo==='R'?'Entrada':'Saída'} de ${brl(x.valor)} salva.`);}
function corrigirVoz(){const x=st.voz.res;st.voz=null;novo(x.tipo,{valor:x.valor,cat:x.cat,desc:x.desc,forma:x.forma||'Pix',nf:!!x.nf});}

/* ---------- instalação ---------- */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._instalar=e;if(st.tela==='inicio')r();});
function instalar(){const e=window._instalar;if(!e)return;e.prompt();e.userChoice.finally(()=>{window._instalar=null;r();});}
const ehIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const emApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
iniciar();
addEventListener('hashchange',()=>{if(/[#&]c=/.test(location.hash))iniciar();}); // convite aberto com o app já na tela
</script>
</body>
</html>
